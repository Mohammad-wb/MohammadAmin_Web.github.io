<!DOCTYPE html>
<html>
<head>
    <title>My First Website</title>
    <style>
        body { background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; font-family: Arial; text-align: center; padding-top: 100px; height: 100vh; margin: 0; }
        h1 { font-size: 50px; }
        p { font-size: 20px; color: #ffd700; }
        button { background-color: #ff4757; color: white; padding: 15px 30px; border: none; border-radius: 50px; font-size: 18px; margin-top: 20px; cursor: pointer; }
        button:hover { background-color: #ff6b81; }
    </style>
</head>
<body>
    <h1>Welcome to My Website!</h1>
    <p>This is my first website!</p>
    <button onclick="alert('Hello! You clicked the button!')">Click Me!</button>
</body>
</html>
