<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>بازی حدس عدد</title>
    <style>
        body {
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
            font-family: Tahoma, sans-serif;
            text-align: center;
            padding-top: 50px;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            display: inline-block;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 { color: #00ff88; }
        input {
            padding: 10px;
            font-size: 18px;
            border-radius: 10px;
            border: none;
            width: 100px;
            text-align: center;
            margin: 10px;
        }
        button {
            background-color: #ff4757;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            margin: 10px;
        }
        button:hover { background-color: #ff6b81; }
        #message {
            font-size: 22px;
            margin-top: 20px;
            color: #ffd700;
            min-height: 30px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>بازی حدس عدد 🎯</h1>
        <p>یه عدد بین ۱ تا ۱۰۰ انتخاب کردم. می‌تونی پیداش کنی؟</p>
        
        <input type="number" id="guessInput" placeholder="عددت رو بزن">
        <button onclick="checkGuess()">حدس بزن!</button>
        
        <div id="message"></div>
    </div>

    <script>
        // انتخاب عدد تصادفی بین 1 تا 100
        let randomNumber = Math.floor(Math.random() * 100) + 1;
        let attempts = 0;

        function checkGuess() {
            let userGuess = Number(document.getElementById('guessInput').value);
            let message = document.getElementById('message');
            attempts++;

            if (userGuess === randomNumber) {
                message.innerHTML = "🎉 آفرین! درست حدس زدی! توی " + attempts + " تلاش برنده شدی.";
                message.style.color = "#00ff88";
            } else if (userGuess < randomNumber) {
                message.innerHTML = "⬆️ عدد بزرگتری انتخاب کن!";
                message.style.color = "#ffa502";
            } else if (userGuess > randomNumber) {
                message.innerHTML = "⬇️ عدد کوچیک‌تری انتخاب کن!";
                message.style.color = "#ffa502";
            } else {
                message.innerHTML = "لطفاً یه عدد معتبر وارد کن.";
            }
        }
    </script>

</body>
</html>
